services:
  - type: web
    name: nepse-portfolio-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NEPSE_DB
        value: /opt/render/project/src/backend/data/app.db
      - key: ALLOWED_ORIGINS
        value: https://tms.sandeepkafle.com.np
    healthCheckPath: /health
